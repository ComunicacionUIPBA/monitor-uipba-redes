name: Actualizar Monitor UIPBA 03-09-2026

on: push

permissions:
  contents: write

jobs:
  fix-default-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fijar fecha inicial
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('renderDashboard("2026-09-02")','renderDashboard("2026-09-03")',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fijar Monitor UIPBA en 03/09/2026"
          git push
