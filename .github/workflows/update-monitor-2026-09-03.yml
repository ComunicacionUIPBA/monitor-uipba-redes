name: Actualizar Monitor UIPBA 03-09-2026

on:
  push:
    paths:
      - '.github/workflows/update-monitor-2026-09-03.yml'

permissions:
  contents: write

jobs:
  update-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Actualizar index.html
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          data = json.loads(r'''{"sector":[{"id":"sec-53","network":"LinkedIn","networkBadge":"bg-uipba-navy text-white","hashtag":"#Industria #DíaDeLaIndustria #Producción #Empleo","title":"La UIA vuelve a poner producción, inversión y empleo en el centro de la agenda industrial","quote":"La cuenta oficial de la Unión Industrial Argentina publicó hoy un mensaje que plantea una Argentina que produzca, invierta, genere empleo y desarrolle capacidades propias, ubicando a la industria como parte central de esa construcción.","action":"Monitorear cómo evoluciona la agenda de competitividad, inversión y empleo planteada por la UIA luego del Día de la Industria, especialmente en relación con las condiciones para sostener producción en las PyMEs.","source":{"name":"UIA — cuenta oficial de LinkedIn","link":"https://ar.linkedin.com/company/union-industrial-argentina","date":"3 Sep 2026"},"metrics":{"temp":5,"volume":"Alto","variation":"Publicación reciente sobre producción, inversión, empleo y capacidades propias"}},{"id":"sec-54","network":"LinkedIn","networkBadge":"bg-uipba-navy text-white","hashtag":"#IndustriaMetalúrgica #Producción #Empleo #Argentina","title":"ADIMRA reivindica talento, trabajo y producción como pilares de la industria argentina","quote":"La cuenta oficial de ADIMRA publicó hoy un mensaje por el Día de la Industria que destaca el talento, el trabajo y la producción y reivindica a quienes todos los días sostienen la actividad industrial argentina.","action":"Seguir el posicionamiento de la industria metalúrgica como señal de clima sectorial y de las demandas vinculadas con producción, empleo y competitividad.","source":{"name":"ADIMRA — cuenta oficial de LinkedIn","link":"https://ar.linkedin.com/company/adimra","date":"3 Sep 2026"},"metrics":{"temp":5,"volume":"Alto","variation":"Publicación reciente; foco en talento, trabajo y producción"}},{"id":"sec-55","network":"LinkedIn","networkBadge":"bg-uipba-navy text-white","hashtag":"#IndustriaQuímica #Petroquímica #Sustentabilidad #Competitividad","title":"La industria química y petroquímica destaca innovación, empleo y sustentabilidad en su agenda sectorial","quote":"El Instituto Petroquímico Argentino publicó hoy un mensaje que reivindica el aporte estratégico de la industria química y petroquímica al desarrollo nacional, con énfasis en innovación, empleo de calidad, sustentabilidad y competitividad.","action":"Registrar la agenda de sectores industriales intensivos en conocimiento y energía, especialmente sus demandas de competitividad y las oportunidades de encadenamiento con otras ramas productivas.","source":{"name":"IPA — cuenta oficial de LinkedIn","link":"https://ar.linkedin.com/company/ipa-instituto-petroquimico-argentino","date":"3 Sep 2026"},"metrics":{"temp":4,"volume":"Alto","variation":"Publicación reciente; innovación, empleo, sustentabilidad y competitividad"}}],"calle":[{"id":"calle-42","region":"conurbano-norte","riskLevel":"Alerta Social","badgeClass":"badge-alert-high","topicNumber":"Tema #1 en Agenda PBA","title":"1. Vecinos de Garín salieron a protestar tras una violenta entradera y reclaman mayor seguridad","streetTalk":"Una violenta entradera ocurrida en Garín dejó a un hombre herido de bala en ambas piernas. Horas después, vecinos de la localidad escobarense se manifestaron en la colectora de Panamericana para reclamar mayor seguridad.","connection":[],"uipbaPosition":"Registrar la inseguridad como una preocupación cotidiana de fuerte impacto territorial; los episodios de violencia y las protestas vecinales afectan la percepción de seguridad de trabajadores, comercios y empresas.","source":{"name":"Pilar a Diario","link":"https://www.pilaradiario.com/policiales/violenta-entradera-garin-le-dispararon-ambas-piernas-n5445483","date":"3 Sep 2026"},"metrics":{"temp":5,"volume":"Alto","variation":"Entradera violenta y protesta vecinal en Garín"}},{"id":"calle-43","region":"general","riskLevel":"Impacto Directo","badgeClass":"badge-alert-high","topicNumber":"Tema #2 en Agenda PBA","title":"2. El paro de transporte altera la movilidad y deja terminales y estaciones con fuerte caída de circulación","streetTalk":"La jornada de paro afecta el transporte público en distintos puntos bonaerenses. En Pilar no circulan trenes y funcionan pocas líneas de colectivos, mientras la terminal y el centro de trasbordo presentan una actividad muy inferior a la habitual.","connection":["Impacto sobre traslados de trabajadores y logística cotidiana","Posibles demoras y menor movilidad en corredores productivos"],"uipbaPosition":"Monitorear el impacto de la medida sobre movilidad laboral, logística y funcionamiento de empresas y parques industriales bonaerenses.","source":{"name":"Pilar a Diario","link":"https://www.pilaradiario.com/informacion-general/asi-se-vive-la-jornada-paro-pilar-n5467898","date":"3 Sep 2026"},"metrics":{"temp":5,"volume":"Alto","variation":"Trenes sin servicio y colectivos con circulación restringida en Pilar"}},{"id":"calle-44","region":"la-plata","riskLevel":"Alerta Climática","badgeClass":"badge-alert-medium","topicNumber":"Tema #3 en Agenda PBA","title":"3. La Plata atraviesa una mañana de tormentas y lluvias antes de una mejora durante la tarde","streetTalk":"El SMN anticipó para este jueves una jornada húmeda e inestable en La Plata, con tormentas aisladas durante la mañana y una mejora hacia la tarde. La temperatura máxima prevista ronda los 18 °C.","connection":[],"uipbaPosition":"Mantener el clima en el radar operativo por sus efectos sobre circulación, logística y actividad comercial, especialmente durante las primeras horas de la jornada.","source":{"name":"0221","link":"https://www.0221.com.ar/la-plata/jueves-gris-y-lluvias-la-plata-la-previa-una-seguidilla-mananas-heladas-n133591","date":"3 Sep 2026"},"metrics":{"temp":4,"volume":"Alto","variation":"Tormentas aisladas por la mañana; mejora prevista durante la tarde"}}],"clipping":[{"id":"clip-65","category":"regional","scopeTag":"Regional (PBA) • La Provincia en Vivo","badgeClass":"badge-alert-high","badgeText":"INDUSTRIA JUNÍN","title":"Junín destaca a la industria como segunda actividad generadora de ingresos del distrito","summary":"El intendente Juan Fiorini encabezó un encuentro con industriales locales y destacó el compromiso y la inversión del sector, señalando su peso en la generación de ingresos, empleo y nuevas oportunidades para la ciudad.","impact":"Aporta una mirada territorial sobre el rol de la industria en el interior bonaerense y sobre la relación entre inversión, ampliación de plantas, incorporación de maquinaria y empleo.","source":{"name":"La Provincia en Vivo","link":"https://laprovinciaenvivo.com/2026/09/03/fiorini-destaco-el-aporte-de-la-industria-al-desarrollo-de-junin/","date":"3 Sep 2026"},"metrics":{"temp":5,"volume":"Alto","variation":"Encuentro con industriales; inversión, empleo y desarrollo local"}},{"id":"clip-66","category":"nacional","scopeTag":"Nacional • Forbes Argentina","badgeClass":"badge-alert-medium","badgeText":"EXPORTACIONES","title":"Buenos Aires volvió a encabezar las exportaciones argentinas durante el primer semestre","summary":"Forbes Argentina informó que Buenos Aires lideró el valor de las exportaciones argentinas en el primer semestre de 2026, seguida por Santa Fe y Córdoba. Las tres jurisdicciones concentraron una parte relevante del comercio exterior nacional.","impact":"El liderazgo exportador bonaerense refuerza la importancia de la competitividad industrial y logística provincial para sostener el aporte de Buenos Aires al comercio exterior.","source":{"name":"Forbes Argentina","link":"https://www.forbesargentina.com/money/el-ranking-provincias-mas-exportaron-primer-semestre-2026-seis-concentraron-casi-80-total-n97030","date":"3 Sep 2026"},"metrics":{"temp":5,"volume":"Alto","variation":"Buenos Aires lidera exportaciones del primer semestre 2026"}},{"id":"clip-67","category":"regional","scopeTag":"Regional (PBA) • Pilar a Diario","badgeClass":"badge-alert-high","badgeText":"TRANSPORTE","title":"El paro de colectivos reduce la circulación en Pilar y carga la Panamericana","summary":"Pilar a Diario registró durante la jornada de paro una circulación muy reducida de colectivos, con trenes sin servicio y una Panamericana más cargada de lo habitual por el traslado de pasajeros hacia otras alternativas.","impact":"La medida tiene impacto directo sobre movilidad de trabajadores y logística en uno de los corredores industriales del norte bonaerense.","source":{"name":"Pilar a Diario","link":"https://www.pilaradiario.com/informacion-general/se-cumple-el-paro-colectivos-pilar-circulan-las-lineas-57-176-276-y-510-pero-restricciones-panamericana-mas-cargada-lo-habitual-n5461471","date":"3 Sep 2026"},"metrics":{"temp":5,"volume":"Alto","variation":"Transporte restringido; mayor carga sobre Panamericana"}},{"id":"clip-68","category":"regional","scopeTag":"Regional (PBA) • 0221","badgeClass":"badge-alert-medium","badgeText":"CLIMA LA PLATA","title":"La Plata transita una mañana gris y lluviosa con mejora prevista para la tarde","summary":"0221 informó que La Plata atraviesa una jornada húmeda e inestable, con tormentas aisladas durante la mañana y mejora hacia la tarde, según el pronóstico del Servicio Meteorológico Nacional.","impact":"El episodio climático es relevante para la agenda cotidiana por sus posibles efectos sobre circulación, actividad comercial y logística urbana.","source":{"name":"0221","link":"https://www.0221.com.ar/la-plata/jueves-gris-y-lluvias-la-plata-la-previa-una-seguidilla-mananas-heladas-n133591","date":"3 Sep 2026"},"metrics":{"temp":4,"volume":"Alto","variation":"Tormentas aisladas por la mañana; mejora durante la tarde"}}]}''')
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          if re.search(r'^\s*"2026-09-03"\s*:', text, re.M):
              raise SystemExit('2026-09-03 ya existe; no se agrega duplicado.')
          entry = json.dumps(data, ensure_ascii=False, indent=12).replace('\n', '\n        ')
          text = text.replace('        const DASHBOARD_DATA = {\n', '        const DASHBOARD_DATA = {\n        "2026-09-03": ' + entry + ',\n', 1)
          text = text.replace('id="current-date-badge">2 Sep 2026', 'id="current-date-badge">3 Sep 2026', 1)
          text = text.replace('<option value="2026-09-02" selected>02/09/2026 (Hoy)</option>', '<option value="2026-09-03" selected>03/09/2026 (Hoy)</option>\n                        <option value="2026-09-02">02/09/2026</option>', 1)
          text = text.replace('Día de la Industria pone en primer plano producción, inversión, empleo y competitividad', 'La industria vuelve a poner producción, inversión, empleo y competitividad en el centro de la agenda', 1)
          text = text.replace('4.4 / 5.0', '4.6 / 5.0', 1)
          text = text.replace('Día de la Industria, crisis PyME, GNC, paro UNLP, alerta climática', 'industria, exportaciones, paro de transporte y clima', 1)
          text = text.replace('2 Críticas (crisis PyME / GNC) + 2 contexto (paro UNLP / alerta climática)', '2 Críticas (seguridad / transporte) + 1 contexto (alerta climática)', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit y publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualizar Monitor UIPBA 03/09/2026"
          git push
