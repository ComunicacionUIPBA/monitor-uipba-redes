name: Apply Monitor UIPBA 05/09/2026
on:
  push:
    branches: [main]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply daily record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          patch=json.loads(Path('update-2026-09-05.json').read_text(encoding='utf-8'))
          if '"2026-09-05"' not in s:
              block=json.dumps(patch['2026-09-05'], ensure_ascii=False, indent=4)
              s=s.replace('const DASHBOARD_DATA = {', 'const DASHBOARD_DATA = {\n    "2026-09-05": ' + block + ',', 1)
              s=s.replace('<span id="current-date-badge">3 Sep 2026</span>', '<span id="current-date-badge">5 Sep 2026</span>', 1)
              s=s.replace('<option value="2026-09-03" selected>03/09/2026 (Hoy)</option>', '<option value="2026-09-05" selected>05/09/2026 (Hoy)</option>\n                        <option value="2026-09-03">03/09/2026</option>', 1)
              s=s.replace('renderDashboard("2026-09-03")', 'renderDashboard("2026-09-05")', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('2026-09-05 already present; no duplicate inserted')
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f update-2026-09-05.json .github/workflows/apply-monitor-2026-09-05.yml
          git add index.html update-2026-09-05.json .github/workflows/apply-monitor-2026-09-05.yml
          git commit -m "Actualizar Monitor UIPBA 05/09/2026" || exit 0
          git push
