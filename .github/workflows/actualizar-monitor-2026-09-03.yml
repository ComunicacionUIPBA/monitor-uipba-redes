          - name: Actualizar archivo
            run: |
              python - <<'PY'
              import os,re
              p='index.html'
              s=open(p,encoding='utf-8').read()
              block=os.environ['PATCH'].replace('\\n','\n')
              if '"2026-09-03"' in s:
                  raise SystemExit('La fecha 2026-09-03 ya existe; no se modifica el archivo.')
              s=s.replace('const DASHBOARD_DATA = {', 'const DASHBOARD_DATA = {\n' + block, 1)
              s=s.replace('<span id="current-date-badge">2 Sep 2026</span>', '<span id="current-date-badge">3 Sep 2026</span>', 1)
              s=s.replace('<option value="2026-09-02" selected>02/09/2026 (Hoy)</option>', '<option value="2026-09-03" selected>03/09/2026 (Hoy)</option>\n                        <option value="2026-09-02">02/09/2026</option>', 1)
              s=s.replace('window.onload = function() {\n            renderDashboard("2026-09-02");', 'window.onload = function() {\n            renderDashboard("2026-09-03");', 1)
              open(p,'w',encoding='utf-8').write(s)
              PY
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Monitor UIPBA 03/09/2026" || exit 0
          git push
      - name: Limpiar workflow temporal
        if: always()
        run: |
          rm -f .github/workflows/actualizar-monitor-2026-09-03.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary update workflow" || exit 0
          git push
